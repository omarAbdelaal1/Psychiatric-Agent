<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>فضفضة — لوحة مقارنة التصاميم (Design Variants Switcher)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Cairo', sans-serif;
      background: #020617;
      color: #f8fafc;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    header {
      background: #0f172a;
      border-bottom: 1px solid #1e293b;
      padding: 0.8rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .header-title h2 {
      font-size: 1.25rem;
      color: #38bdf8;
    }
    .header-title p {
      font-size: 0.8rem;
      color: #94a3b8;
    }
    .switcher-nav {
      display: flex;
      gap: 0.5rem;
    }
    .nav-btn {
      background: #1e293b;
      border: 1px solid #334155;
      color: #cbd5e1;
      padding: 0.5rem 1rem;
      border-radius: 8px;
      font-family: inherit;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .nav-btn.active {
      background: #0284c7;
      color: #ffffff;
      border-color: #38bdf8;
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.4);
    }
    .preview-container {
      flex: 1;
      position: relative;
      background: #000;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>
  <header>
    <div class="header-title">
      <h2>فضفضة — مقارنة البدائل التصميمية الأربعة (Omni-Orchestrator v3)</h2>
      <p>استعراض حي ومباشر لأربعة نماذج تصميمية تختلف في الهيكلية وكثافة المحتوى والتفاعل</p>
    </div>

    <div class="switcher-nav">
      <button class="nav-btn active" onclick="switchVariant('variant-01.html', this)">البديل 1: الملاذ الهادئ (Sanctuary)</button>
      <button class="nav-btn" onclick="switchVariant('variant-02.html', this)">البديل 2: العيادة المساندة (Split-View)</button>
      <button class="nav-btn" onclick="switchVariant('variant-03.html', this)">البديل 3: هالة الصوت التفاعلية (Voice Orb)</button>
      <button class="nav-btn" onclick="switchVariant('variant-04.html', this)">البديل 4: سجل الرعاية والذاكرة (Care Journal)</button>
    </div>
  </header>

  <div class="preview-container">
    <iframe id="preview-frame" src="variant-01.html"></iframe>
  </div>

  <script>
    function switchVariant(url, btn) {
      document.getElementById('preview-frame').src = url;
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    }
  </script>
</body>
</html>
